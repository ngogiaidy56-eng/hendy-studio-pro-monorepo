apiVersion: v1
kind: ConfigMap
metadata:
  name: hendy-studio-config
  labels: { app.kubernetes.io/name: hendy-studio }
data:
  NODE_ENV: production
  API_PORT: "8080"
  JWT_TTL: 15m
  MONGODB_DATABASE: hendy_studio
  CORS_ORIGINS: https://admin.hendystudio.net,https://hendystudio.com
  S3_REGION: auto
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hendy-studio-api
  labels: { app: hendy-studio-api }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: hendy-studio-api } }
  template:
    metadata: { labels: { app: hendy-studio-api } }
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: ghcr.io/YOUR_ORG/hendy-studio-api:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          ports: [{ name: http, containerPort: 8080 }]
          envFrom:
            - configMapRef: { name: hendy-studio-config }
            - secretRef: { name: hendy-studio-secrets }
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: { cpu: 200m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
---
apiVersion: v1
kind: Service
metadata:
  name: hendy-studio-api
spec:
  type: ClusterIP
  selector: { app: hendy-studio-api }
  ports: [{ name: http, port: 8080, targetPort: http }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hendy-studio-render-worker
  labels: { app: hendy-studio-render-worker }
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  selector: { matchLabels: { app: hendy-studio-render-worker } }
  template:
    metadata: { labels: { app: hendy-studio-render-worker } }
    spec:
      terminationGracePeriodSeconds: 60
      containers:
        - name: render-worker
          image: ghcr.io/YOUR_ORG/hendy-studio-api:RELEASE_TAG
          imagePullPolicy: IfNotPresent
          command: ["bun", "run", "--filter", "@hendy/core-server", "worker"]
          envFrom:
            - configMapRef: { name: hendy-studio-config }
            - secretRef: { name: hendy-studio-secrets }
          resources:
            requests: { cpu: 500m, memory: 512Mi }
            limits: { cpu: "2", memory: 4Gi }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 10001
            capabilities: { drop: [ALL] }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: hendy-studio-api
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: hendy-studio-api }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }

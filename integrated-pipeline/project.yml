name: HendyStudioPro
topLevelDirectory: .
options:
  bundleIdPrefix: net.hendystudio.pro
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
targets:
  HendyStudioPro:
    type: application
    platform: iOS
    sources:
      - path: iosApp
        excludes:
          - README.md
          - project.yml
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.hendystudio.pro.ios
        PRODUCT_NAME: Hendy Studio Pro
        MARKETING_VERSION: "1.2.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_HendyStudioURL: https://hendy-studio-web.onrender.com
        INFOPLIST_KEY_CFBundleDisplayName: Hendy Studio Pro
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.video
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGN_STYLE: Automatic
